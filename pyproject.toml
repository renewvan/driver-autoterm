[project]
name = "driver-heater"
version = "0.1.0"
description = "Autoterm AIR 2D diesel heater driver for the renewvan hub (serial UART to MQTT)"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
    "pyserial>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_heater*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
