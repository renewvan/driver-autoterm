; driver-autoterm — Heater device configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = driver-autoterm
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[device]
; Topic segment: renewvan/heater/<id>/... A second heater is a second Driver
; process with its own id, client_id and serial_device.
id = heater_01
; Human label; empty = not published.
name = Heater
update_interval_ms = 1000
serial_device = /dev/ttyAUTOTERM
reply_timeout_s = 1.0
; Off by default: the broker is anonymous, so enabling this lets anyone on the
; LAN start and stop the heater. Must be exactly true or false.
commands_enabled = false
; No valid status for this long: commands are rejected and live fields cleared.
stale_after_s = 5
; Send the 0x1C -> 0x04 -> 0x06 init sequence on connect (not needed on an AIR 2D; harmless if on).
send_init = false
