; driver-heater — Heater device configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = driver-heater
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[device]
id = heater
update_interval_ms = 3000
; TODO: add Heater-specific keys here once the hardware/feed
; interface is decided (serial port, I2C address, remote feed host,
; baud rate, ...) — mirror them in driver_heater/config.py's DeviceConfig.
